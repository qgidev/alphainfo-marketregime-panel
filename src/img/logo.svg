<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AlphaInfo Market Regime Monitor — dark navy badge, silver ring, and a
       candlestick tape whose volatility regime shifts mid-window: tight calm
       candles becoming wide, long-wicked ones. Green/red candle duo reads
       instantly as "market"; the size contrast reads as the regime shift. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F3F5"/>
      <stop offset="0.45" stop-color="#9DA3AE"/>
      <stop offset="0.75" stop-color="#E4E6EA"/>
      <stop offset="1" stop-color="#7F8694"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#141C2B"/>
      <stop offset="1" stop-color="#0B111C"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring)" stroke-width="11"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#0A0F18" stroke-width="3" opacity="0.6"/>

  <!-- regime divider -->
  <line x1="240" y1="150" x2="240" y2="362" stroke="#8A93A3" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="2 14" opacity="0.7"/>

  <!-- calm regime: tight candles -->
  <g filter="url(#glow)">
    <line x1="113" y1="242" x2="113" y2="292" stroke="#26A69A" stroke-width="6" stroke-linecap="round"/>
    <rect x="100" y="252" width="26" height="26" rx="4" fill="#26A69A"/>
    <line x1="155" y1="238" x2="155" y2="290" stroke="#EF5350" stroke-width="6" stroke-linecap="round"/>
    <rect x="142" y="248" width="26" height="26" rx="4" fill="#EF5350"/>
    <line x1="197" y1="230" x2="197" y2="282" stroke="#26A69A" stroke-width="6" stroke-linecap="round"/>
    <rect x="184" y="240" width="26" height="26" rx="4" fill="#26A69A"/>
  </g>

  <!-- volatile regime: wide bodies, long wicks -->
  <g filter="url(#glow)">
    <line x1="275" y1="176" x2="275" y2="330" stroke="#EF5350" stroke-width="7" stroke-linecap="round"/>
    <rect x="258" y="204" width="34" height="86" rx="5" fill="#EF5350"/>
    <line x1="327" y1="142" x2="327" y2="312" stroke="#26A69A" stroke-width="7" stroke-linecap="round"/>
    <rect x="310" y="166" width="34" height="104" rx="5" fill="#26A69A"/>
    <line x1="379" y1="168" x2="379" y2="356" stroke="#EF5350" stroke-width="7" stroke-linecap="round"/>
    <rect x="362" y="200" width="34" height="112" rx="5" fill="#EF5350"/>
    <line x1="425" y1="130" x2="425" y2="290" stroke="#26A69A" stroke-width="7" stroke-linecap="round"/>
    <rect x="410" y="156" width="30" height="96" rx="5" fill="#26A69A"/>
  </g>
</svg>
